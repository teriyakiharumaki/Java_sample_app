<!DOCTYPE html>
<html>
<head>
    <title>チャット</title>

    <link href="/webjars/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet">
    <link href="/main.css" rel="stylesheet">

    <script src="/webjars/jquery/3.1.1-1/jquery.min.js"></script>
    <script src="/webjars/sockjs-client/1.0.2/sockjs.min.js"></script>
    <script src="/webjars/stomp-websocket/2.3.3/stomp.min.js"></script>
    <script src="/app.js"></script>
</head>
<body>
<noscript><h2 style="color: #ff0000">Seems your browser doesn't support Javascript! Websocket relies on Javascript being
    enabled. Please enable
    Javascript and reload this page!</h2></noscript>
<div id="main-content" class="container">
    <div class="row">
        <div class="col-md-6">
            <form class="form-inline">
                <div class="form-group">
                    <label for="connect">WebSocket接続 :</label>
                    <button id="connect" class="btn btn-default" type="submit">接続する</button>
                    <button id="disconnect" class="btn btn-default" type="submit" disabled="disabled">接族解除
                    </button>
                </div>
            </form>
        </div>
        <div class="col-md-6">
            <form class="form-inline">
                <div class="form-group">
                    <label for="name">名前</label>
                    <input type="text" id="name" class="form-control" placeholder="名前を入力">
                </div>
                <div class="form-group">
                    <label for="name">メッセージ</label>
                    <input type="text" id="message" class="form-control" placeholder="こんにちは">
                </div>
                <button id="send" class="btn btn-default" type="submit">送信</button>
            </form>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <table id="conversation" class="table table-striped">
                <thead>
                <tr>
                    <th>トーク</th>
                </tr>
                </thead>
                <tbody id="greetings">
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
